# =======================================================
# ⚠️ 注意 / WARNING
# 本配置使用了 Mihomo v1.19.19 的新特性：
# fake-ip-filter-mode: rule
#
# 请确保你的客户端内核版本 >= v1.19.19
# 低于此版本会导致配置加载失败或报错。
# =======================================================

# NodeParam 锚点
NodeParam: &NodeParam {type: http, interval: 3600, health-check: {enable: true, url: 'https://www.gstatic.com/generate_204', interval: 300}}

proxy-providers:
  Fusion:
    <<: *NodeParam
    url: "订阅"
  Guise:
   <<: *NodeParam
    url: "订阅"

# 全局配置
mixed-port: 7890
allow-lan: true
bind-address: "*"
unified-delay: true
tcp-concurrent: true
log-level: error
ipv6: false
keep-alive-idle: 15
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true
find-process-mode: strict
# ui
external-controller: 0.0.0.0:19090
external-ui: ui
external-ui-url: https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip
external-controller-cors:
  allow-origins:
    - '*'
  allow-private-network: true

ntp:
  enable: true
  #写入系统（管理员）
  write-to-system: false
  server: ntp.ntsc.ac.cn
  port: 123
  interval: 30

# GeoX
geodata-mode: true
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 12
geox-url:
  geoip: https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@release/geoip.dat
  geosite: https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@release/geosite.dat
  mmdb: https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-City.mmdb
  asn: https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@release/GeoLite2-ASN.mmdb

# 入站
tun:
  enable: true
  stack: mixed
  device: mihomo
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53

# 嗅探
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# DNS模块
dns:
  enable: true
  listen: 0.0.0.0:1053
  prefer-h3: false
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - system
    - 223.5.5.5
  proxy-server-nameserver:
    - system
    - 223.5.5.5
  nameserver:
    - system
    - 223.5.5.5

  fake-ip-filter-mode: rule
  fake-ip-filter:
    - GEOSITE,private,real-ip
    - GEOSITE,connectivity-check,real-ip
    - GEOSITE,cn,real-ip
    - MATCH,fake-ip

proxy-groups:

  - name: 🔰 节点选择
    type: select
    proxies: [DIRECT, 🚀 手动切换, 🇭🇰 香港, 🇨🇳 台湾, 🇸🇬 新加坡, 🇯🇵 日本, 🇪🇺 欧洲, 🇺🇲 美国]
      
  - name: 🚀 手动切换
    type: select
    interval: 300
    url: 'https://www.gstatic.com/generate_204'
    proxies: [DIRECT]
    use:
      - Fusion

  - name: 🪟 微软服务
    type: select
    proxies: [DIRECT, 🔰 节点选择, 🚀 手动切换, 🇭🇰 香港, 🇨🇳 台湾, 🇸🇬 新加坡, 🇯🇵 日本, 🇪🇺 欧洲, 🇺🇲 美国]
    
  - name: 🍎 苹果服务
    type: select
    proxies: [DIRECT, 🔰 节点选择, 🚀 手动切换, 🇭🇰 香港, 🇨🇳 台湾, 🇸🇬 新加坡, 🇯🇵 日本, 🇪🇺 欧洲, 🇺🇲 美国]

  - name: 🎬 影视服务
    type: select
    proxies: [DIRECT, 🔰 节点选择, 🚀 手动切换, 🇭🇰 香港, 🇨🇳 台湾, 🇸🇬 新加坡, 🇯🇵 日本, 🇪🇺 欧洲, 🇺🇲 美国]

  - name: 🎭 伪装
    type: select
    proxies: [DIRECT, 🔰 节点选择, 🚀 手动切换]
    use:
      - Guise

  - name: 🎯 全球直连
    type: select
    proxies: [DIRECT, 🔰 节点选择, 🚀 手动切换]

  - name: 🔀 回退路由
    type: select
    proxies: [DIRECT, 🔰 节点选择, 🚀 手动切换]

  - name: 🇭🇰 香港
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "(港|HK|hk|Hong Kong|HongKong|hongkong)"

  - name: 🇨🇳 台湾
    type: select
    include-all: true
    interval: 300
    filter: "(台|新北|彰化|TW|Taiwan)"

  - name: 🇸🇬 新加坡
    type: select
    include-all: true
    interval: 300
    filter: "(新加坡|坡|狮城|SG|Singapore)"

  - name: 🇯🇵 日本
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)"

  - name: 🇪🇺 欧洲
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "(?i)(EU|德国|Germany|DE|法国|France|英国|UK|荷兰|Netherlands|NL|西班牙|Spain|瑞士|Switzerland|瑞典|Sweden|希腊|Greece|俄罗斯|Russia|RU|莫斯科|Moscow|土耳其|Turkey)"

  - name: 🇺🇲 美国
    type: url-test
    include-all: true
    tolerance: 150
    interval: 300
    filter: "(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)"

### 规则集锚点
RuleSet_classical_text: &RuleSet_classical_text {type: http, behavior: classical, interval: 43200, format: text}
#RuleSet_domain_mrs: &RuleSet_domain_mrs {type: http, behavior: domain, interval: 43200, format: mrs}
#RuleSet_domain_text: &RuleSet_domain_text {type: http, behavior: domain, interval: 43200, format: text}
#RuleSet_ipcidr_mrs: &RuleSet_ipcidr_mrs {type: http, behavior: ipcidr, interval: 43200, format: mrs}
#RuleSet_ipcidr_text: &RuleSet_ipcidr_text {type: http, behavior: ipcidr, interval: 43200, format: text}

rule-providers:
  # 自定义Provider
  custom:
    <<: *RuleSet_classical_text
    url: https://raw.githubusercontent.com/nugent1a/Clash-Rules/refs/heads/main/Ruleset/custom.list
  media:
    <<: *RuleSet_classical_text
    url: https://raw.githubusercontent.com/nugent1a/Clash-Rules/refs/heads/main/Ruleset/media.list

rules:
  # 节点选择_高优先级
  - GEOSITE,speedtest,🔰 节点选择
  - GEOSITE,upai,🔰 节点选择
  - GEOSITE,ipip,🔰 节点选择
  - GEOSITE,github,🔰 节点选择
  - GEOSITE,paypal,🔰 节点选择
  - GEOSITE,tiktok,🔰 节点选择
  # Google
  - GEOSITE,google,🔰 节点选择
  # AI
  - GEOSITE,category-ai-chat-!cn,🔰 节点选择
  # Crypto
  - GEOSITE,category-cryptocurrency,🇨🇳 台湾
  # 18+
  - GEOSITE,category-porn,🎬 影视服务
  # media
  - RULE-SET,media,🎬 影视服务
  # 微软服务
  - GEOSITE,microsoft,🪟 微软服务
  # 苹果服务
  - GEOSITE,apple,🍎 苹果服务
  # 自行维护补充
  - RULE-SET,custom,🔰 节点选择
  # GFW 列表 (兜底大名单)
  - GEOSITE,gfw,🔰 节点选择
  # 最后的非国内域名兜底
  - GEOSITE,geolocation-!cn,🔰 节点选择
  # IP 辅助规则
  - GEOIP,tiktok,🔰 节点选择,no-resolve
  - GEOIP,twitter,🔰 节点选择,no-resolve
  - GEOIP,telegram,🔰 节点选择,no-resolve
  - GEOIP,netflix,🔰 节点选择,no-resolve
  - GEOIP,google,🔰 节点选择,no-resolve
  # 伪装
  - GEOSITE,bytedance,🎭 伪装
  - GEOSITE,bilibili,🎭 伪装
  - GEOSITE,sina,🎭 伪装
  - GEOSITE,xiaohongshu,🎭 伪装
  - GEOSITE,zhihu,🎭 伪装
  # 直连
  - GEOSITE,private,🎯 全球直连
  - GEOIP,private,🎯 全球直连,no-resolve
  # 中国大陆
  - GEOSITE,CN,🎯 全球直连
  - GEOIP,CN,🎯 全球直连,no-resolve
  - GEOIP,lan,🎯 全球直连,no-resolve
  - MATCH,🔀 回退路由
